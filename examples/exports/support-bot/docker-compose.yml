# Generated by Agent Configurator. Start everything with: docker compose up --build
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
    - 5432:5432
    volumes:
    - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U app -d app
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    depends_on:
      postgres:
        condition: service_healthy
    build: ./backend
    env_file:
    - .env
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/app
    ports:
    - 8000:8000
    volumes:
    - backend-data:/app/data
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')
      interval: 10s
      timeout: 5s
      retries: 6
  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
    - 3000:3000
    depends_on:
      backend:
        condition: service_healthy
volumes:
  backend-data: {}
  pgdata: {}
