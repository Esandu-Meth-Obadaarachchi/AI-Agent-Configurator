# Generated by Agent Configurator. Start everything with: docker compose up --build
services:
  backend:
    build: ./backend
    env_file:
    - .env
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/app
    ports:
    - 8000:8000
    volumes:
    - backend-data:/app/data
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')
      interval: 10s
      timeout: 5s
      retries: 6
  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
    - 3000:3000
    depends_on:
      backend:
        condition: service_healthy
volumes:
  backend-data: {}
