name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[api,dev]"
      - run: ruff check packages apps/api tests scripts examples/build_examples.py
      - run: mypy
      - run: pytest

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  matrix:
    # Render every supported combination and run each export's own ruff, mypy and tests.
    needs: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pip install -e ".[api,dev]"
      - run: python scripts/verify_matrix.py

  compose-boot:
    # The exit test from the brief: a generated project boots with docker compose up.
    needs: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[api]"
      - run: configurator generate examples/specs/support-bot.json -o /tmp/support-bot
      - run: |
          cd /tmp/support-bot
          cp .env.example .env
          sed -i 's/^LLM_PROVIDER=.*/LLM_PROVIDER=fake/' .env
          docker compose up -d --build
          for i in $(seq 1 60); do curl -sf localhost:8000/api/health && break; sleep 5; done
          curl -sf localhost:8000/api/health
          curl -sf localhost:3000/ > /dev/null
          docker compose down -v
